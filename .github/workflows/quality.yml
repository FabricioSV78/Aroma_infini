name: Quality and isolated regression tests

on:
  push:
    # develop runs this same suite through deploy-staging.yml, once per push.
    branches-ignore: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_WRITE_LOGS: 'false'
  VITE_APP_ENV: production
  VITE_CATALOG_SOURCE: local
  VITE_SITE_URL: ''
  VITE_SUPABASE_URL: ''
  VITE_SUPABASE_PUBLISHABLE_KEY: ''
  VITE_MEDIA_API_BASE_URL: ''
  VITE_ALLOW_INDEXING: 'false'
  VITE_CATALOG_IS_REAL: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:node
      - run: npm run build
      - run: npm run security:audit

  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [contracts, browser-core, browser-accounts, browser-commerce]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:isolated -- ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: isolated-${{ matrix.group }}
          path: artifacts/
          retention-days: 7

  sql-local:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # SQL accepts no remote connection string and starts its own temporary DB.
      - run: npm install --prefix artifacts/supabase-sql-tools --no-save embedded-postgres@17.10.0-beta.17 pg@8.23.1
      - run: npm run test:supabase:sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sql-local-results
          path: artifacts/supabase-sql-tests/**/result.json
          retention-days: 7
