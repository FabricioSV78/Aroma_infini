project_id = "aroma-infini-prod"

[api]
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db.ssl_enforcement]
enabled = true

[auth]
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.change-email]
verify_jwt = false

[functions.account-recovery]
verify_jwt = false
